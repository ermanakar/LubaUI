name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (SwiftPM)
    runs-on: macos-15
    strategy:
      matrix:
        xcode: ['16.2']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      - name: Typecheck documented example
        run: bash Scripts/check-examples.sh

      - name: Verify independent products and legacy imports
        run: bash Scripts/check-consumers.sh

  ios-library-build:
    name: iOS Simulator (library only)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Deliberately uses the runner's *default* Xcode instead of pinning a
      # version. GitHub installs simulator runtimes only for the default
      # Xcode; a pinned older Xcode can still be on the image with its iOS
      # platform stripped, which fails as "iOS <version> is not installed"
      # and an empty destination list — not as a missing SDK, which makes it
      # easy to misread as a bad destination specifier.
      - name: Show toolchain and available iOS SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || echo "no iOS SDK on this runner"

      # Builds the LubaUI *library* target against the iOS SDK.
      #
      # - `generic/platform=iOS Simulator` needs no booted device and no
      #   specific device name, so the job cannot break when GitHub changes
      #   its simulator roster.
      # - The scheme comes from Package.swift (xcodebuild synthesizes it), so
      #   nothing depends on the showcase app or its asset catalog. A broken
      #   showcase asset can never hide the fact that the library itself
      #   compiles for iOS.
      - name: Build LubaUI for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme LubaUI \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ios \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tail -20

  mcp-package:
    name: MCP catalog and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm test
